<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <img src="img/playlist.png" alt="playlist" id="playlist-img">
        <h2>FEEL THE MUSIC</h2>
        <img src="img/music.png" alt="music" id="music-img">

    </header>
    <main>
        <div class="left">
            <div class="song-image">
                <img src="img/musicanim.gif" alt="musicanim" id="musicanim">

            </div>
            <div class="volume-div">
                <div class="volume-img">
                <img src="img/volume-up.png" alt="volume-up" id="volume-img">
                </div>
                <input type="range" id="volume-range" onchange="volume()">
            </div>
        </div>
        <div class="right">
            <div class="details">
                <h3 id="song-name">Rafta Rafta </h3>
                <h5 id="song-artist">Atif Aslam</h5>
            </div>
            <input type="range" id="song-duration" onchange="Duration()">
            <div class="controls">
                <div class="prev-img"><img src="img/previous.png" alt="prev" id="prev-img" onclick="previousSong()">
                </div>
                <div class="play-pause"><img src="img/play.png" alt="play-pause" id="play-pause" onclick="playPause()">
                </div>
                <div class="next-img"><img src="img/next.png" alt="next" id="next-img" onclick="nextSong()">
                </div>
                
            </div>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
